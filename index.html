<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ReSpace</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  overflow: hidden;
  background: #000;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Apple SD Gothic Neo",
    "Noto Sans KR",
    sans-serif;
}

button,
input,
select {
  font-family: inherit;
}


/* =========================
   화면
========================= */

.screen {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100dvh;

  overflow-y: auto;
  overflow-x: hidden;

  transition:
    opacity 0.45s ease,
    transform 0.45s ease;
}

.hidden {
  opacity: 0;
  pointer-events: none;

  transform:
    translateX(30px);
}

.visible {
  opacity: 1;
  pointer-events: auto;

  transform:
    translateX(0);
}


/* =========================
   메인 화면
========================= */

#mainScreen {
  display: flex;

  align-items: center;
  justify-content: center;

  background:
    linear-gradient(
      rgba(0,0,0,0.42),
      rgba(0,0,0,0.55)
    ),
    url("main.jpg")
    center / cover
    no-repeat;
}

.main-content {
  width: 100%;
  padding: 40px 28px;

  text-align: center;
}

.logo {
  margin-bottom: 14px;

  color: #65adf5;

  font-size: 40px;
  font-weight: 700;

  letter-spacing: -1.5px;
}

.main-title {
  margin-bottom: 35px;

  color: #fff;

  font-size: 26px;
  font-weight: 600;

  letter-spacing: -1px;
}

.main-description {
  display: none;
}

.start-button {
  border: none;

  background:
    rgba(65,145,225,0.97);

  color: #fff;

  padding: 15px 38px;

  border-radius: 999px;

  font-size: 15px;
  font-weight: 600;

  cursor: pointer;
}

.start-button:active {
  transform: scale(0.96);
}


/* =========================
   작업 화면
========================= */

#workScreen {
  background:
    linear-gradient(
      rgba(0,0,0,0.40),
      rgba(0,0,0,0.62)
    ),
    url("work-bg.jpg")
    center / cover
    no-repeat;

  color: #fff;
}

.work-inner {
  width: 100%;
  max-width: 520px;

  margin: 0 auto;

  padding: 18px 18px 35px;
}


/* =========================
   뒤로가기
========================= */

.top-bar {
  display: flex;

  align-items: center;

  height: 42px;

  margin-bottom: 8px;
}

.back-button {
  border: none;

  background: transparent;

  color: #fff;

  font-size: 32px;
  font-weight: 300;

  line-height: 1;

  padding: 0;

  cursor: pointer;
}


/* =========================
   사진 선택
========================= */

.photo-buttons {
  display: flex;

  gap: 8px;

  margin-bottom: 10px;
}

.photo-button {
  flex: 1;

  height: 44px;

  border:
    1px solid
    rgba(255,255,255,0.45);

  border-radius: 11px;

  background: transparent;

  color: #fff;

  font-size: 13px;
  font-weight: 500;

  cursor: pointer;
}

.photo-button:active {
  transform: scale(0.98);
}


/* =========================
   사진
========================= */

.upload-box {
  position: relative;

  width: 100%;

  min-height: 220px;

  border:
    1px solid
    rgba(255,255,255,0.45);

  border-radius: 18px;

  background: transparent;

  overflow: hidden;

  margin-bottom: 14px;
}

.upload-placeholder {
  position: absolute;

  inset: 0;

  display: flex;

  align-items: center;
  justify-content: center;

  color: #fff;

  font-size: 14px;

  opacity: 0.85;

  pointer-events: none;
}

#photoInput {
  display: none;
}

#cameraInput {
  display: none;
}

#previewImage {
  display: none;

  width: 100%;

  min-height: 220px;

  height: 100%;

  object-fit: cover;

  cursor: crosshair;
}


/* =========================
   사진 마커
========================= */

.marker {
  position: absolute;

  transform:
    translate(-50%, -100%);

  z-index: 20;

  display: flex;

  flex-direction: column;

  align-items: center;

  pointer-events: none;
}

.marker-label {
  white-space: nowrap;

  padding: 5px 8px;

  margin-bottom: 4px;

  border-radius: 7px;

  background:
    rgba(10,70,140,0.92);

  color: #fff;

  font-size: 11px;
  font-weight: 500;
}

.marker-dot {
  width: 12px;
  height: 12px;

  border-radius: 50%;

  background: #65adf5;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,0.3);
}

.marker-arrow {
  width: 0;
  height: 0;

  border-left:
    7px solid transparent;

  border-right:
    7px solid transparent;

  border-top:
    9px solid #65adf5;
}

.delete-marker {
  position: absolute;

  top: -6px;
  right: -10px;

  width: 18px;
  height: 18px;

  border: none;

  border-radius: 50%;

  background:
    rgba(10,70,140,0.95);

  color: #fff;

  font-size: 12px;

  padding: 0;

  pointer-events: auto;

  cursor: pointer;
}


/* =========================
   개선 유형
========================= */

.input-section {
  margin-bottom: 14px;

  padding-bottom: 14px;

  border-bottom:
    1px solid
    rgba(255,255,255,0.28);
}

#problemSelect,
.direct-input,
.search-input {
  width: 100%;

  height: 48px;

  border:
    1px solid
    rgba(255,255,255,0.45);

  border-radius: 12px;

  background: transparent;

  color: #fff;

  outline: none;

  padding: 0 14px;

  font-size: 14px;
}

#problemSelect option {
  background: #333;
  color: #fff;
}

.direct-input {
  display: none;

  margin-top: 8px;
}

.direct-input::placeholder,
.search-input::placeholder {
  color:
    rgba(255,255,255,0.65);
}


/* =========================
   지도
========================= */

.map-wrapper {
  margin-top: 15px;

  padding-bottom: 14px;

  border-bottom:
    1px solid
    rgba(255,255,255,0.28);
}

#map {
  position: relative;

  width: 100%;

  height: 280px;

  border:
    1px solid
    rgba(255,255,255,0.45);

  border-radius: 16px;

  overflow: hidden;
}


/* =========================
   지도 중앙 표시
========================= */

.center-pin {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.center-pin-arrow {
  position: relative;
  width: 0;
  height: 0;
  border-left: 9px solid transparent;
  border-right: 9px solid transparent;
  border-top: 16px solid #5fa8f5;
  margin-bottom: 2px;
}

.center-pin-arrow::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -19px;
  transform: translateX(-50%);
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  z-index: -1;
}

.center-pin-circle {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #5fa8f5;
  border: 3px solid #fff;
}


/* =========================
   검색
========================= */

.search-row {
  display: flex;

  gap: 7px;

  margin-top: 9px;
}

.search-input {
  flex: 1;
}

.search-button {
  width: 70px;

  border:
    1px solid
    rgba(255,255,255,0.45);

  border-radius: 10px;

  background: transparent;

  color: #fff;

  font-size: 12px;

  cursor: pointer;
}

.location-button {
  display: block;

  margin:
    9px auto 0;

  border: none;

  background: transparent;

  color: #fff;

  text-decoration: underline;

  text-underline-offset: 3px;

  font-size: 12px;

  cursor: pointer;
}


/* =========================
   지도 저작권
========================= */

.leaflet-control-attribution {
  font-size: 7px !important;

  opacity: 0.7;
}


/* =========================
   다음
========================= */

.next-button {
  width: 100%;

  height: 50px;

  margin-top: 18px;

  border:
    1px solid
    rgba(77,163,255,0.7);

  border-radius: 13px;

  background:
    rgba(77,163,255,0.94);

  color: #fff;

  font-size: 15px;
  font-weight: 600;

  cursor: pointer;
}

.next-button:active {
  transform: scale(0.98);
}


/* =========================
   개선 창 텍스트 전체 흰색
========================= */

#workScreen,
#workScreen label,
#workScreen p,
#workScreen h1,
#workScreen h2,
#workScreen h3,
#workScreen span {
  color: #fff;
}


/* =========================
   개선 창 카드 제거
   칸 구분만 유지
========================= */

#workScreen .card,
#workScreen .section,
#workScreen .work-card,
#workScreen .photo-section,
#workScreen .improvement-section,
#workScreen .location-section,
#workScreen .proposal-section {
  background: transparent !important;

  box-shadow: none !important;
}


/* =========================
   입력칸 투명 처리
========================= */

#workScreen .photo-button,
#workScreen #problemSelect,
#workScreen .direct-input,
#workScreen .search-input,
#workScreen .search-button {
  background: transparent !important;

  color: #fff !important;
}


/* =========================
   입력칸 구분선
========================= */

#workScreen .photo-button,
#workScreen #problemSelect,
#workScreen .direct-input,
#workScreen .search-input,
#workScreen .search-button {
  border:
    1px solid
    rgba(255,255,255,0.45) !important;
}


/* =========================
   placeholder
========================= */

#workScreen .direct-input::placeholder,
#workScreen .search-input::placeholder {
  color: rgba(255,255,255,1.00);
}

#map .leaflet-control-zoom {
  display: block !important;
}

#map .leaflet-control-zoom a,
#map .leaflet-control-zoom a:hover,
#map .leaflet-control-zoom a:focus {
  color: #000000 !important;
  -webkit-text-fill-color: #000000 !important;
  text-shadow: none !important;
}

/* =========================
   제안서 작성
========================= */

#proposalScreen {
  background:
    linear-gradient(
      rgba(0,0,0,0.40),
      rgba(0,0,0,0.62)
    ),
    url("work-bg.jpg")
    center / cover
    no-repeat;

  color: #fff;
}

.proposal-inner {
  width: min(100%, 680px);
  margin: 0 auto;
  padding: 18px 20px 40px;
}

.proposal-top-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}

.proposal-top-bar h1 {
  margin: 0;
  font-size: 22px;
  letter-spacing: -0.8px;
}

.proposal-notice {
  margin: 0 0 18px;
  color: rgba(255,255,255,0.85);
  font-size: 13px;
  line-height: 1.6;
}

.proposal-paper {
  padding: 22px 18px;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.proposal-paper h2 {
  margin: 0 0 20px;
  text-align: center;
  font-size: 21px;
}

.proposal-field {
  margin: 0 0 16px;
}

.proposal-field label,
.proposal-field-title {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 700;
}

.proposal-field input,
.proposal-field textarea,
.proposal-field select {
  width: 100%;
  padding: 12px;
  border: 1px solid rgba(255,255,255,0.45);
  border-radius: 12px;
  background: transparent;
  color: #fff;
  font-size: 15px;
}

.proposal-field textarea {
  min-height: 130px;
  resize: vertical;
  line-height: 1.55;
}

.proposal-readonly {
  padding: 12px;
  border: 1px solid rgba(255,255,255,0.45);
  border-radius: 12px;
  background: transparent;
  font-size: 14px;
  line-height: 1.55;
  white-space: pre-line;
}

.proposal-photo-wrap {
  overflow: hidden;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.45);
  background: transparent;
}

.proposal-photo-wrap .upload-box {
  min-height: 0;
  width: 100%;
  margin: 0;
}

.proposal-photo-wrap .delete-marker {
  display: none;
}

#proposalMap {
  width: 100%;
  height: 220px;
  border: 1px solid rgba(255,255,255,0.45);
  border-radius: 18px;
  overflow: hidden;
}

.optional-details {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid rgba(255,255,255,0.28);
}

.optional-details summary {
  cursor: pointer;
  color: #fff;
  font-size: 14px;
}

.proposal-actions {
  display: grid;
  gap: 10px;
  margin-top: 20px;
}

.proposal-action {
  min-height: 52px;
  border: 1px solid rgba(255,255,255,0.45);
  border-radius: 13px;
  background: transparent;
  color: #fff;
  padding: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.download-proposal {
  border-color: rgba(77,163,255,0.7);
  background: rgba(77,163,255,0.94);
  color: #fff;
}

.epeople-link {
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.45);
  color: #fff;
  text-decoration: none;
}

#proposalScreen label,
#proposalScreen p,
#proposalScreen h1,
#proposalScreen h2,
#proposalScreen h3,
#proposalScreen span,
#proposalScreen summary {
  color: #fff;
}

#proposalScreen .back-button {
  color: #fff;
}

#proposalScreen .proposal-field input::placeholder,
#proposalScreen .proposal-field textarea::placeholder {
  color: rgba(255,255,255,0.65);
}

#proposalScreen .proposal-field select option {
  background: #333;
  color: #fff;
}

@media print {
  body { overflow: visible; background: #fff; }
  #mainScreen, #workScreen, .proposal-top-bar, .proposal-notice, .proposal-actions { display: none !important; }
  #proposalScreen { position: static; display: block !important; overflow: visible; background: #fff; }
  .proposal-inner { max-width: none; padding: 0; }
  .proposal-paper { border: 0; box-shadow: none; }
}
</style>
</head>


<body>


<!-- =================================
     메인
================================= -->

<section
  id="mainScreen"
  class="screen visible"
>

  <div class="main-content">

    <div class="logo">
      ReSpace
    </div>

    <div class="main-title">
      불편한 공간, 더 나은 공간으로
    </div>

    <div class="main-description">
      사진으로 생활 속 불편을 알리고<br>
      더 나은 공간을 직접 제안해보세요
    </div>

    <button
      class="start-button"
      onclick="startProject()"
    >
      시작하기
    </button>

  </div>

</section>


<!-- =================================
     작업
================================= -->

<section
  id="workScreen"
  class="screen hidden"
>

  <div class="work-inner">


    <!-- 뒤로가기 -->

    <div class="top-bar">

      <button
        class="back-button"
        onclick="goBack()"
      >
        ‹
      </button>

    </div>


    <!-- 사진 선택 -->

    <div class="photo-buttons">

      <button
        class="photo-button"
        onclick="openCamera()"
      >
        사진 촬영
      </button>

      <button
        class="photo-button"
        onclick="openGallery()"
      >
        앨범에서 선택
      </button>

    </div>


    <input
      type="file"
      id="photoInput"
      accept="image/*"
    >

    <input
      type="file"
      id="cameraInput"
      accept="image/*"
      capture="environment"
    >


    <!-- 사진 -->

    <div
      class="upload-box"
      id="uploadBox"
    >

      <div
        class="upload-placeholder"
        id="uploadPlaceholder"
      >
        사진을 선택해주세요
      </div>

      <img
        id="previewImage"
        alt="선택한 사진"
      >

    </div>


    <!-- 개선 유형 -->

    <div class="input-section">

      <select id="problemSelect">

        <option value="">
          개선 유형을 선택해주세요
        </option>

        <option value="가로등 필요">
          가로등 필요
        </option>

        <option value="CCTV 설치">
          CCTV 설치
        </option>

        <option value="벤치 필요">
          벤치 필요
        </option>

        <option value="포트홀 처리">
          포트홀 처리
        </option>

        <option value="쓰레기통 설치">
          쓰레기통 설치
        </option>

        <option value="보도블록 정비">
          보도블록 정비
        </option>

        <option value="횡단보도 설치">
          횡단보도 설치
        </option>

        <option value="안전시설 설치">
          안전시설 설치
        </option>

        <option value="주차공간 개선">
          주차공간 개선
        </option>

        <option value="기타">
          기타
        </option>

        <option value="direct">
          직접입력
        </option>

      </select>


      <input
        id="directInput"
        class="direct-input"
        type="text"
        placeholder="원하는 개선사항을 직접 입력해주세요"
      >

    </div>


    <!-- 지도 -->

    <div class="map-wrapper">

      <div id="map">

        <div class="center-pin">

          <div
            class="center-pin-arrow"
          ></div>

          <div
            class="center-pin-circle"
          ></div>

        </div>

      </div>


      <div class="search-row">

        <input
          id="searchInput"
          class="search-input"
          type="text"
          placeholder="주소 또는 장소 검색"
        >

        <button
          class="search-button"
          onclick="searchLocation()"
        >
          검색
        </button>

      </div>


      <button
        class="location-button"
        onclick="setCurrentLocation()"
      >
        이 위치로 설정
      </button>

    </div>


    <!-- 다음 -->

    <button
      class="next-button"
      onclick="nextStep()"
    >
      제안서 작성하기
    </button>

  </div>

</section>


<!-- =================================
     제안서 작성
================================= -->

<section
  id="proposalScreen"
  class="screen hidden"
>

  <div class="proposal-inner">

    <div class="proposal-top-bar">
      <button class="back-button" onclick="backToWork()" aria-label="작업 화면으로 돌아가기">‹</button>
    </div>

    <div class="proposal-paper" id="proposalPaper">
      <h2>공간 개선 제안서</h2>

      <div class="proposal-field">
        <label for="proposalTitle">민원·제안 제목</label>
        <input id="proposalTitle" type="text" placeholder="예: ○○골목 보행 안전을 위한 가로등 설치 제안">
      </div>

      <div class="proposal-field">
        <span class="proposal-field-title">개선 위치</span>
        <div class="proposal-readonly" id="proposalLocation"></div>
      </div>

      <div class="proposal-field">
        <span class="proposal-field-title">지도에서 설정한 위치</span>
        <div id="proposalMap" aria-label="선택한 개선 위치 지도"></div>
      </div>

      <div class="proposal-field">
        <span class="proposal-field-title">사진 및 개선 표시</span>
        <div class="proposal-photo-wrap" id="proposalPhoto"></div>
      </div>

      <div class="proposal-field">
        <span class="proposal-field-title">개선 항목</span>
        <div class="proposal-readonly" id="proposalMarkers"></div>
      </div>

      <div class="proposal-field">
        <label for="proposalDetail">상세 개선내용</label>
        <textarea id="proposalDetail" placeholder="불편한 점, 개선이 필요한 이유, 기대 효과를 구체적으로 작성해주세요.&#10;&#10;예: 이 골목은 밤에 너무 어두워 보행 시 불안합니다. 보행 안전을 위해 가로등을 설치해 주시기 바랍니다."></textarea>
      </div>

      <details class="optional-details">
        <summary>신청인 정보 직접 입력하기 (선택)</summary>
        <div class="proposal-field">
          <label for="applicantName">성명</label>
          <input id="applicantName" type="text" autocomplete="name" placeholder="직접 입력">
        </div>
        <div class="proposal-field">
          <label for="applicantAddress">주소</label>
          <input id="applicantAddress" type="text" autocomplete="street-address" placeholder="직접 입력">
        </div>
        <div class="proposal-field">
          <label for="applicantContact">연락처 또는 전자우편</label>
          <input id="applicantContact" type="text" autocomplete="email" placeholder="직접 입력">
        </div>
        <div class="proposal-field">
          <label for="noticeMethod">희망 통지방식</label>
          <select id="noticeMethod">
            <option value="">선택 안 함</option>
            <option>전자우편</option>
            <option>문자메시지</option>
            <option>서면</option>
          </select>
        </div>
      </details>
    </div>

    <div class="proposal-actions">
      <button class="proposal-action download-proposal" onclick="downloadProposal()">제안서 저장·다운로드</button>
      <a class="proposal-action epeople-link" href="https://www.epeople.go.kr/" target="_blank" rel="noopener">국민신문고에서 민원 신청하기</a>
    </div>

  </div>

</section>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>


/* =================================
   변수
================================= */

let map = null;

let proposalMap = null;

let proposalLocationMarker = null;

let selectedLatitude = null;

let selectedLongitude = null;

let selectedAddress = "";

let markers = [];


/* =================================
   화면 이동
================================= */

function startProject() {

  document
    .getElementById("mainScreen")
    .classList.remove("visible");

  document
    .getElementById("mainScreen")
    .classList.add("hidden");


  document
    .getElementById("workScreen")
    .classList.remove("hidden");

  document
    .getElementById("workScreen")
    .classList.add("visible");


  setTimeout(
    initMap,
    450
  );

}


function goBack() {

  document
    .getElementById("workScreen")
    .classList.remove("visible");

  document
    .getElementById("workScreen")
    .classList.add("hidden");


  document
    .getElementById("mainScreen")
    .classList.remove("hidden");

  document
    .getElementById("mainScreen")
    .classList.add("visible");

}


/* =================================
   사진 선택
================================= */

function openGallery() {

  document
    .getElementById("photoInput")
    .click();

}


function openCamera() {

  document
    .getElementById("cameraInput")
    .click();

}


/* =================================
   사진 처리
================================= */

function loadPhoto(file) {

  if (!file) {
    return;
  }


  const reader =
    new FileReader();


  reader.onload =
    function(event) {

      const image =
        document.getElementById(
          "previewImage"
        );


      image.src =
        event.target.result;


      image.style.display =
        "block";


      document
        .getElementById(
          "uploadPlaceholder"
        )
        .style.display =
        "none";


      clearMarkers();

    };


  reader.readAsDataURL(file);

}


document
  .getElementById("photoInput")
  .addEventListener(
    "change",
    function(event) {

      loadPhoto(
        event.target.files[0]
      );

    }
  );


document
  .getElementById("cameraInput")
  .addEventListener(
    "change",
    function(event) {

      loadPhoto(
        event.target.files[0]
      );

    }
  );


/* =================================
   사진 클릭
================================= */

document
  .getElementById("uploadBox")
  .addEventListener(
    "click",
    function(event) {

      const image =
        document.getElementById(
          "previewImage"
        );


      if (
        !image.src ||
        image.style.display === "none"
      ) {

        return;

      }


      if (
        event.target.closest(
          ".delete-marker"
        )
      ) {

        return;

      }


      createPhotoMarker(event);

    }
  );


/* =================================
   개선 유형
================================= */

document
  .getElementById("problemSelect")
  .addEventListener(
    "change",
    function() {

      const directInput =
        document.getElementById(
          "directInput"
        );


      if (
        this.value === "direct"
      ) {

        directInput.style.display =
          "block";

        directInput.focus();

      } else {

        directInput.style.display =
          "none";

      }

    }
  );


/* =================================
   사진 마커
================================= */

function createPhotoMarker(event) {

  const select =
    document.getElementById(
      "problemSelect"
    );


  let problem =
    select.value;


  if (
    problem === "direct"
  ) {

    problem =
      document
        .getElementById(
          "directInput"
        )
        .value
        .trim();

  }


  if (!problem) {

    alert(
      "개선 유형을 먼저 선택해주세요"
    );

    return;

  }


  const rect =
    document
      .getElementById(
        "uploadBox"
      )
      .getBoundingClientRect();


  const x =
    event.clientX -
    rect.left;


  const y =
    event.clientY -
    rect.top;


  createMarker(
    x,
    y,
    problem
  );

}


/* =================================
   마커 생성
================================= */

function createMarker(
  x,
  y,
  problem
) {

  const marker =
    document.createElement(
      "div"
    );


  marker.className =
    "marker";


  marker.style.left =
    x + "px";


  marker.style.top =
    y + "px";


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "marker-label";


  label.textContent =
    problem;


  const dot =
    document.createElement(
      "div"
    );


  dot.className =
    "marker-dot";


  const arrow =
    document.createElement(
      "div"
    );


  arrow.className =
    "marker-arrow";


  const deleteButton =
    document.createElement(
      "button"
    );


  deleteButton.className =
    "delete-marker";


  deleteButton.textContent =
    "×";


  deleteButton.addEventListener(
    "click",
    function(event) {

      event.stopPropagation();

      marker.remove();

      markers =
        markers.filter(
          item =>
            item !== marker
        );

    }
  );


  marker.appendChild(label);

  marker.appendChild(dot);

  marker.appendChild(arrow);

  marker.appendChild(deleteButton);


  document
    .getElementById(
      "uploadBox"
    )
    .appendChild(marker);


  markers.push(marker);

}


/* =================================
   마커 초기화
================================= */

function clearMarkers() {

  markers.forEach(
    marker =>
      marker.remove()
  );


  markers = [];

}


/* =================================
   지도
================================= */

function initMap() {

  if (map) {

    setTimeout(
      () => map.invalidateSize(),
      100
    );

    return;

  }


map =
  L.map("map", {
    zoomControl: false
  })
    .setView(
      [37.5665, 126.9780],
      15
    );

L.control.zoom({
  position: "topright"
}).addTo(map);


  L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,

      attribution:
        "&copy; OpenStreetMap"
    }
  ).addTo(map);


  map.on(
    "moveend",
    updateMapCenter
  );


  updateMapCenter();

}


/* =================================
   지도 중앙 좌표
================================= */

function updateMapCenter() {

  if (!map) {
    return;
  }


  const center =
    map.getCenter();


  selectedLatitude =
    center.lat;


  selectedLongitude =
    center.lng;

}


/* =================================
   위치 설정
================================= */

async function setCurrentLocation() {

  if (!map) {
    return;
  }


  updateMapCenter();


  try {

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/reverse" +
        "?format=json" +
        "&lat=" +
        selectedLatitude +
        "&lon=" +
        selectedLongitude +
        "&zoom=18" +
        "&addressdetails=1",
        {
          headers: {
            "Accept-Language": "ko"
          }
        }
      );


    const data =
      await response.json();


    if (
      data &&
      data.address
    ) {

      selectedAddress =
        makeKoreanAddress(
          data.address
        );


      document
        .getElementById(
          "searchInput"
        )
        .value =
        selectedAddress;

    }


  } catch (error) {

    console.error(error);

    alert(
      "주소를 불러오지 못했습니다"
    );

  }

}


/* =================================
   한국식 주소
================================= */

function makeKoreanAddress(
  address
) {

  const result = [];


  function add(value) {

    if (
      value &&
      !result.includes(value)
    ) {

      result.push(value);

    }

  }


  add(address.state);

  add(address.city);

  add(address.county);

  add(address.city_district);

  add(address.town);

  add(address.village);

  add(address.suburb);


  if (address.road) {

    let road =
      address.road;


    if (
      address.house_number
    ) {

      road +=
        " " +
        address.house_number;

    }


    add(road);

  }


  return result.join(" ");

}


/* =================================
   장소 검색
================================= */

async function searchLocation() {

  const input =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim();


  if (!input) {

    alert(
      "주소나 장소를 입력해주세요"
    );

    return;

  }


  try {

    const response =
      await fetch(
        "https://nominatim.openstreetmap.org/search" +
        "?format=json" +
        "&q=" +
        encodeURIComponent(input) +
        "&limit=1" +
        "&countrycodes=kr" +
        "&addressdetails=1",
        {
          headers: {
            "Accept-Language": "ko"
          }
        }
      );


    const results =
      await response.json();


    if (
      !results ||
      results.length === 0
    ) {

      alert(
        "검색 결과를 찾지 못했습니다"
      );

      return;

    }


    const result =
      results[0];


    const lat =
      parseFloat(
        result.lat
      );


    const lon =
      parseFloat(
        result.lon
      );


    map.setView(
      [lat, lon],
      18
    );


    if (result.address) {

      selectedAddress =
        makeKoreanAddress(
          result.address
        );


      document
        .getElementById(
          "searchInput"
        )
        .value =
        selectedAddress;

    }


  } catch (error) {

    console.error(error);

    alert(
      "주소 검색 중 문제가 발생했습니다"
    );

  }

}


/* =================================
   엔터 검색
================================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        searchLocation();

      }

    }
  );


/* =================================
   다음 단계
================================= */

function nextStep() {

  const image =
    document.getElementById(
      "previewImage"
    );


  if (
    !image.src ||
    image.style.display === "none"
  ) {

    alert(
      "사진을 먼저 선택해주세요"
    );

    return;

  }


  if (
    markers.length === 0
  ) {

    alert(
      "사진에서 개선이 필요한 위치를 선택해주세요"
    );

    return;

  }


  const select =
    document.getElementById(
      "problemSelect"
    );


  let problem =
    select.value;


  if (
    problem === "direct"
  ) {

    problem =
      document
        .getElementById(
          "directInput"
        )
        .value
        .trim();

  }


  if (!problem) {

    alert(
      "개선 유형을 선택해주세요"
    );

    return;

  }


  if (
    selectedLatitude === null ||
    selectedLongitude === null
  ) {

    alert(
      "개선 위치를 지도에서 설정해주세요"
    );

    return;

  }


  openProposalScreen(problem);

}


/* =================================
   제안서 작성
================================= */

function openProposalScreen(problem) {

  const location =
    selectedAddress ||
    "선택한 지도 위치";


  document
    .getElementById("proposalLocation")
    .textContent =
    location;


  const markerTexts =
    markers.map(
      (marker, index) =>
        (index + 1) + ". " +
        marker.querySelector(".marker-label").textContent
    );


  document
    .getElementById("proposalMarkers")
    .textContent =
    markerTexts.join("\n");


  const title =
    document.getElementById("proposalTitle");


  if (!title.value.trim()) {

    title.value =
      problem + " 관련 공간 개선 제안";

  }


  const proposalPhoto =
    document.getElementById("proposalPhoto");


  proposalPhoto.innerHTML = "";


  const photoCopy =
    document.getElementById("uploadBox").cloneNode(true);


  photoCopy.id = "proposalImageCopy";


  photoCopy
    .querySelectorAll(".delete-marker")
    .forEach(button => button.remove());


  proposalPhoto.appendChild(photoCopy);


  document
    .getElementById("workScreen")
    .classList.remove("visible");

  document
    .getElementById("workScreen")
    .classList.add("hidden");

  document
    .getElementById("proposalScreen")
    .classList.remove("hidden");

  document
    .getElementById("proposalScreen")
    .classList.add("visible");


  setTimeout(updateProposalMap, 450);

}


function updateProposalMap() {

  const position =
    [selectedLatitude, selectedLongitude];


  if (!proposalMap) {

    proposalMap =
      L.map("proposalMap", {
        zoomControl: false,
        attributionControl: true
      })
      .setView(position, 17);


    L.tileLayer(
      "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap"
      }
    ).addTo(proposalMap);

  } else {

    proposalMap.setView(position, 17);

  }


  if (proposalLocationMarker) {
    proposalLocationMarker.remove();
  }


  proposalLocationMarker =
    L.marker(position)
      .addTo(proposalMap)
      .bindPopup("선택한 개선 위치");


  proposalMap.invalidateSize();

}


function backToWork() {

  document
    .getElementById("proposalScreen")
    .classList.remove("visible");

  document
    .getElementById("proposalScreen")
    .classList.add("hidden");

  document
    .getElementById("workScreen")
    .classList.remove("hidden");

  document
    .getElementById("workScreen")
    .classList.add("visible");


  if (map) {
    setTimeout(() => map.invalidateSize(), 450);
  }

}


function proposalValue(id) {

  return document
    .getElementById(id)
    .value
    .trim();

}


function downloadProposal() {

  const detail = proposalValue("proposalDetail");


  if (!detail) {
    alert("상세 개선내용을 작성해주세요");
    return;
  }


  const title = proposalValue("proposalTitle");

  const optionalInfo = [
    ["성명", proposalValue("applicantName")],
    ["주소", proposalValue("applicantAddress")],
    ["연락처 또는 전자우편", proposalValue("applicantContact")],
    ["희망 통지방식", proposalValue("noticeMethod")]
  ].filter(item => item[1]);


  const savedPhoto =
    document
      .getElementById("proposalPhoto")
      .innerHTML;


  const style =
    Array.from(document.styleSheets)
      .map(sheet => {
        try {
          return Array.from(sheet.cssRules)
            .map(rule => rule.cssText)
            .join("\n");
        } catch (error) {
          return "";
        }
      })
      .join("\n");


  const safe = value =>
    value.replace(/[&<>\"']/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;",
      "\"": "&quot;", "'": "&#39;"
    })[character]);


  const documentHtml = `<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${safe(title || "공간 개선 제안서")}</title>
<style>${style}
html,body{height:auto!important;min-height:100%;overflow:visible!important}body{margin:0;padding:24px;background:#f6f4ef;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1d1d1d}.saved-paper{max-width:680px;margin:auto;padding:24px;background:#fff;border:1px solid #d8d4cb;border-radius:14px}.saved-paper h1{text-align:center;font-size:22px}.saved-row{margin:20px 0}.saved-label{display:block;margin-bottom:7px;font-weight:700;font-size:14px}.saved-content{padding:12px;border:1px solid #e2ded6;border-radius:8px;background:#faf9f6;white-space:pre-wrap;line-height:1.55}.proposal-photo-wrap .upload-box{display:block;position:relative;overflow:hidden}.proposal-photo-wrap #previewImage{display:block;width:100%;height:auto}.proposal-photo-wrap .upload-placeholder{display:none}@media print{body{padding:0;background:#fff}.saved-paper{max-width:none;border:0;box-shadow:none}}
</style></head><body><main class="saved-paper"><h1>공간 개선 제안서</h1>
<div class="saved-row"><span class="saved-label">민원·제안 제목</span><div class="saved-content">${safe(title)}</div></div>
<div class="saved-row"><span class="saved-label">개선 위치</span><div class="saved-content">${safe(document.getElementById("proposalLocation").textContent)}</div></div>
<div class="saved-row"><span class="saved-label">사진 및 개선 표시</span><div class="proposal-photo-wrap">${savedPhoto}</div></div>
<div class="saved-row"><span class="saved-label">개선 항목</span><div class="saved-content">${safe(document.getElementById("proposalMarkers").textContent)}</div></div>
<div class="saved-row"><span class="saved-label">상세 개선내용</span><div class="saved-content">${safe(detail)}</div></div>
${optionalInfo.length ? `<div class="saved-row"><span class="saved-label">신청인 정보 (사용자 입력)</span><div class="saved-content">${optionalInfo.map(item => safe(item[0]) + ": " + safe(item[1])).join("\n")}</div></div>` : ""}
</main></body></html>`;


  const blob =
    new Blob([documentHtml], { type: "text/html;charset=utf-8" });

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "ReSpace_공간개선_제안서.html";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(link.href);

}

</script>

</body>
</html>
